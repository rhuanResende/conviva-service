databaseChangeLog:
  - changeSet:
      id: 008-create-table-security-event
      author: rhuan.resende
      changes:
        - createTable:
            schemaName: auth
            tableName: tb_security_event
            columns:
              - column:
                  name: co_id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: co_user
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: tp_event
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

              - column:
                  name: ds_message
                  type: VARCHAR(255)

              - column:
                  name: dt_created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false